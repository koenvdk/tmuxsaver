name: Release

# Releases are cut automatically: when a commit lands on main whose
# TMUXSAVER_VERSION (in ./tmuxsaver) has no v<version> tag yet, this builds the
# .deb and creates the tag and GitHub release on that exact commit. To release,
# bump the version in a PR (`make bump V=x.y.z`) and merge it — no manual
# tagging needed. Merges that don't change the version release nothing.
#
# Pushing a v* tag by hand still works, but the tag must match the
# TMUXSAVER_VERSION of the commit it points at, or the run fails instead of
# publishing a mislabeled package.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need existing tags to tell whether this version is released

      - name: Determine version
        id: version
        run: |
          version=$(sed -n 's/^TMUXSAVER_VERSION="\(.*\)"$/\1/p' tmuxsaver)
          if [ -z "$version" ]; then
            echo "::error::TMUXSAVER_VERSION not found in ./tmuxsaver"
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME points at a commit whose TMUXSAVER_VERSION is $version. Delete the tag and tag the commit that carries that version."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check scripts
        if: steps.version.outputs.release == 'true'
        run: make check

      - name: Build .deb
        if: steps.version.outputs.release == 'true'
        run: |
          make deb
          test -f "tmuxsaver_${{ steps.version.outputs.version }}_all.deb"

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "tmuxsaver ${{ steps.version.outputs.tag }}"
          body: |
            ## Install

            Download the `.deb` below and install with:

            ```bash
            wget -P /tmp https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/tmuxsaver_${{ steps.version.outputs.version }}_all.deb
            sudo apt install /tmp/tmuxsaver_${{ steps.version.outputs.version }}_all.deb
            ```

            Then follow the post-install instructions to enable the systemd service
            and (optionally) per-session shell history.

            See [README](https://github.com/${{ github.repository }}#readme) for full details.
          files: tmuxsaver_${{ steps.version.outputs.version }}_all.deb
          generate_release_notes: true
