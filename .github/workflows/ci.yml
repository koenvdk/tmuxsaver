name: CI

# Runs on every PR and on main. Releases are handled by release.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: make check
      - name: shellcheck
        run: make lint

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux zsh
          tmux -V
      - name: End-to-end tests (.deb install, bash/zsh save+restore, uninstall, install.sh)
        run: sudo tests/integration.sh
